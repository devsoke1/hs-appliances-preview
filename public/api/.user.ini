; PHP settings for the form endpoints (read by PHP-FPM / LSAPI on Hostinger).
; Allows 3 photos x 5MB plus form fields. Changes can take up to 5 minutes to apply.
upload_max_filesize = 6M
post_max_size = 20M
max_file_uploads = 5
max_execution_time = 60
display_errors = Off
log_errors = On
expose_php = Off
